name: Publish

on:
  workflow_dispatch:
  repository_dispatch:
    types: [design-system-release]

permissions:
  contents: write
  checks: read
  actions: read
  id-token: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: maple-design-mobile
    steps:
      - uses: actions/checkout@v4
        with:
          path: maple-design-mobile
          ref: ${{ github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: sparknest-team/design-ui
          path: design-ui
          token: ${{ secrets.DESIGN_SYSTEM_CI_TOKEN || secrets.DESIGN_UI_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: |
            maple-design-mobile/pnpm-lock.yaml
            design-ui/pnpm-lock.yaml
          registry-url: https://registry.npmjs.org
      - run: corepack pnpm install --frozen-lockfile
        working-directory: design-ui
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:check
      - run: pnpm lint:check
      - run: pnpm test
      - run: pnpm build:lib
      - run: pnpm package:check
      - name: Require Quality for this main commit
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.checks.listForRef({ ...context.repo, ref: context.sha, per_page: 100 });
            const check = data.check_runs.find(run => run.name === 'quality' && run.app?.slug === 'github-actions');
            if (!check || check.status !== 'completed' || check.conclusion !== 'success') throw new Error('Run and pass Quality on this exact main commit before publishing');
      - run: pnpm exec changeset publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
