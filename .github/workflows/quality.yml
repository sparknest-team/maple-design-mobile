name: Quality

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: maple-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: loca-spirit/design-ui
          path: .design-ui
      - uses: pnpm/action-setup@v4
        with:
          version: 9.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:check
      - run: pnpm lint:check
        # Existing formatting/lint debt is non-blocking during baseline cleanup.
        continue-on-error: true
      - run: pnpm typecheck
        # Existing repository-wide Vue type debt is tracked separately; remove
        # this flag after the baseline reaches zero.
        continue-on-error: true
      - run: pnpm test
      - run: pnpm build
      - run: pnpm package:check
